<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Mercadinho</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; padding: 20px 0; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        
        .logo-container {
            width: 100px;
            height: 100px;
            background-color: #e9ecef;
            border: 2px dashed #ced4da;
            border-radius: 10px;
            margin: 0 auto 15px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #6c757d;
            font-size: 12px;
            font-weight: bold;
        }
        .logo-container span { font-size: 24px; margin-bottom: 2px; }

        input { width: 90%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .camera-box {
            position: relative;
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video, canvas { width: 100%; display: block; border-radius: 8px; }
        
        .face-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 220px;
            border: 3px dashed #00ffcc;
            border-radius: 50% / 60%;
            pointer-events: none;
        }

        button { width: 95%; padding: 12px; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-verde { background-color: #28a745; }
        .btn-verde:hover { background-color: #218838; }
        .btn-azul { background-color: #007bff; }
        .btn-azul:hover { background-color: #0056b3; }
        .btn-vermelho { background-color: #dc3545; }
        .btn-vermelho:hover { background-color: #c82333; }
        .btn-cinza { background-color: #6c757d; }
        .btn-cinza:hover { background-color: #5a6268; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <span>🛒</span>
            LOGO DO MERCADINHO
        </div>

        <!-- TELA DE CADASTRO -->
        <div id="telaCadastro">
            <h2>Cadastro de Cliente</h2>
            <input type="text" id="nome" placeholder="Nome Completo *" required>
            <input type="text" id="cpf" placeholder="CPF *" required>
            <input type="tel" id="telefone" placeholder="Telefone / WhatsApp">
            <input type="email" id="email" placeholder="E-mail">
            <input type="text" id="rua" placeholder="Rua / Logradouro">
            <input type="text" id="bairro" placeholder="Bairro">
            <input type="text" id="cidade" placeholder="Cidade">
            <input type="text" id="estado" placeholder="Estado (Ex: SP)">
            <input type="text" id="pais" placeholder="País" value="Brasil">
            
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <div id="mask" class="face-mask"></div>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>

            <button id="btnCapturar" class="btn-verde" onclick="tirarFoto()">Capturar Foto</button>
            <button id="btnSalvar" class="btn-azul" onclick="cadastrar()" style="display:none;">Finalizar Cadastro</button>
            <button class="btn-vermelho" onclick="irParaTelaExclusao()">Excluir Cadastro</button>
            <p id="statusCadastro" style="font-weight: bold; margin-top: 10px;"></p>
        </div>

        <!-- TELA DE EXCLUSÃO -->
        <div id="telaExclusao" style="display: none;">
            <h2>Excluir Cadastro</h2>
            <p style="font-size: 14px; color: #666;">Digite o CPF do cliente que deseja remover do sistema:</p>
            <input type="text" id="cpfExcluir" placeholder="Digite o CPF *" required>
            
            <button class="btn-vermelho" onclick="executarExclusao()">Confirmar Exclusão</button>
            <button class="btn-cinza" onclick="voltarParaCadastro()">Voltar</button>
            <p id="statusExclusao" style="font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const mask = document.getElementById('mask');
        let fotoData = '';

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => video.srcObject = stream)
            .catch(err => alert("Erro ao acessar a câmera: " + err));

        function tirarFoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            fotoData = canvas.toDataURL('image/jpeg');
            video.style.display = 'none';
            mask.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('btnCapturar').innerText = 'Tirar Outra Foto';
            document.getElementById('btnCapturar').onclick = resetarFoto;
            document.getElementById('btnSalvar').style.display = 'block';
        }

        function resetarFoto() {
            video.style.display = 'block';
            mask.style.display = 'block';
            canvas.style.display = 'none';
            document.getElementById('btnCapturar').innerText = 'Capturar Foto';
            document.getElementById('btnCapturar').onclick = tirarFoto;
            document.getElementById('btnSalvar').style.display = 'none';
        }

        function irParaTelaExclusao() {
            document.getElementById('telaCadastro').style.display = 'none';
            document.getElementById('telaExclusao').style.display = 'block';
        }

        function voltarParaCadastro() {
            document.getElementById('telaExclusao').style.display = 'none';
            document.getElementById('telaCadastro').style.display = 'block';
        }

        async function cadastrar() {
            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const telefone = document.getElementById('telefone').value;
            const email = document.getElementById('email').value;
            const rua = document.getElementById('rua').value;
            const bairro = document.getElementById('bairro').value;
            const cidade = document.getElementById('cidade').value;
            const estado = document.getElementById('estado').value;
            const pais = document.getElementById('pais').value;
            const status = document.getElementById('statusCadastro');

            if (!nome || !cpf || !fotoData) {
                alert("Preencha o Nome, CPF e tire a foto!");
                return;
            }

            status.innerHTML = '<div class="spinner"></div> Cadastrando...';
            document.getElementById('btnSalvar').disabled = true;

            try {
                const resposta = await fetch('/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf, telefone, email, rua, bairro, cidade, estado, pais, foto: fotoData })
                });

                const dados = await resposta.json();
                if (dados.sucesso) {
                    status.innerText = "Cadastro realizado com sucesso!";
                    setTimeout(() => location.reload(), 2000);
                } else {
                    status.innerText = "Erro: " + dados.erro;
                    document.getElementById('btnSalvar').disabled = false;
                }
            } catch (err) {
                status.innerText = "Erro de conexão com o servidor.";
                document.getElementById('btnSalvar').disabled = false;
            }
        }

        async function executarExclusao() {
            const cpf = document.getElementById('cpfExcluir').value;
            const status = document.getElementById('statusExclusao');

            if (!cpf) {
                alert("Digite o CPF para prosseguir!");
                return;
            }

            status.innerHTML = '<div class="spinner" style="border-top-color:#dc3545"></div> Excluindo...';

            try {
                const resposta = await fetch('/deletar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf })
                });

                const dados = await resposta.json();
                if (dados.sucesso) {
                    status.innerText = dados.mensagem;
                    setTimeout(() => {
                        location.reload(); // Retorna para a tela inicial de cadastro
                    }, 2000);
                } else {
                    status.innerText = "Erro: " + dados.erro;
                }
            } catch (err) {
                status.innerText = "Erro de conexão com o servidor.";
            }
        }
    </script>
</body>
</html>
