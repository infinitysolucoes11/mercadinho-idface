<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Market - Acesso do Cliente</title>
    <style>
        :root {
            --cor-principal: #ff6600;
            --cor-fundo: #121212;
            --cor-card: #1e1e1e;
            --cor-texto: #ffffff;
            --cor-cinza: #b0b0b0;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: var(--cor-fundo); 
            color: var(--cor-texto);
            margin: 0; 
            padding: 20px 0; 
        }

        .card { 
            background: var(--cor-card); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.15); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            border: 1px solid #333;
        }
        
        .logo-container {
            width: 80px;
            height: 80px;
            background-color: #2a2a2a;
            border: 2px dashed var(--cor-principal);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--cor-principal);
            font-size: 10px;
            font-weight: bold;
        }
        .logo-container span { font-size: 24px; margin-bottom: 2px; }

        h2 { color: var(--cor-principal); margin-bottom: 15px; }
        
        input, select { 
            width: 90%; 
            padding: 12px; 
            margin: 6px 0; 
            background-color: #2a2a2a;
            border: 1px solid #444; 
            color: white;
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--cor-principal); outline: none; }

        .camera-box {
            position: relative;
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video, canvas { width: 100%; display: block; border-radius: 8px; }
        
        .face-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 180px;
            border: 3px dashed var(--cor-principal);
            border-radius: 50% / 60%;
            pointer-events: none;
        }

        button { width: 95%; padding: 12px; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; transition: 0.2s; }
        .btn-laranja { background-color: var(--cor-principal); color: #000; }
        .btn-laranja:hover { background-color: #e05b00; }
        .btn-azul { background-color: #007bff; color: white; }
        .btn-azul:hover { background-color: #0056b3; }
        .btn-vermelho { background-color: #dc3545; color: white; }
        .btn-vermelho:hover { background-color: #c82333; }
        .btn-cinza { background-color: #444; color: #fff; }
        .btn-cinza:hover { background-color: #555; }
        
        .link-text { color: var(--cor-principal); cursor: pointer; font-size: 13px; margin-top: 12px; display: inline-block; text-decoration: underline; }

        /* Dashboard Pós-Login */
        .dashboard-box { text-align: left; }
        .welcome-msg { font-size: 18px; color: var(--cor-principal); font-weight: bold; margin-bottom: 10px; text-align: center; }
        .section-title { font-size: 13px; font-weight: bold; color: var(--cor-cinza); margin: 15px 0 6px 0; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 4px; }
        
        .lojas-list { max-height: 120px; overflow-y: auto; font-size: 13px; background: #252525; padding: 8px; border-radius: 6px; }
        .loja-item { margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .loja-item strong { color: var(--cor-principal); }

        .ads-space {
            width: 100%;
            height: 75px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--cor-cinza);
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <span>🛒</span>
            MICRO MARKET
        </div>

        <!-- TELA 1: LOGIN DO CLIENTE -->
        <div id="telaLogin">
            <h2>Entrar no Sistema</h2>
            <input type="text" id="loginCpf" placeholder="Digite seu CPF">
            <input type="password" id="loginSenha" placeholder="Digite sua Senha">
            <button class="btn-laranja" onclick="fazerLogin()">Entrar</button>
            <span class="link-text" onclick="mudarParaTela('telaCadastro')">Não tem cadastro? Cadastre-se aqui</span>
            <p id="statusLogin" style="font-weight: bold; margin-top: 10px; font-size: 13px;"></p>
        </div>

        <!-- TELA 2: CADASTRO DO CLIENTE -->
        <div id="telaCadastro" style="display: none;">
            <h2>Novo Cadastro</h2>
            <input type="text" id="nome" placeholder="Nome Completo *" required>
            <input type="text" id="cpf" placeholder="CPF *" required>
            <input type="password" id="senha" placeholder="Crie uma Senha *" required>
            <input type="tel" id="telefone" placeholder="Telefone / WhatsApp">
            <input type="email" id="email" placeholder="E-mail">
            <input type="text" id="rua" placeholder="Rua / Logradouro">
            <input type="text" id="bairro" placeholder="Bairro">
            <input type="text" id="cidade" placeholder="Cidade">
            <input type="text" id="estado" placeholder="Estado (Ex: SP)">
            <input type="text" id="pais" placeholder="País" value="Brasil">
            
            <select id="unidade_id" required>
                <option value="">Carregando unidades...</option>
            </select>
            
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <div id="mask" class="face-mask"></div>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>

            <button id="btnCapturar" class="btn-laranja" onclick="tirarFoto()">Capturar Foto</button>
            <button id="btnSalvar" class="btn-azul" onclick="cadastrar()" style="display:none;">Finalizar Cadastro</button>
            <span class="link-text" onclick="mudarParaTela('telaLogin')">Já possui cadastro? Faça login</span>
            <p id="statusCadastro" style="font-weight: bold; margin-top: 10px; font-size: 13px;"></p>
        </div>

        <!-- TELA 3: PAINEL / DASHBOARD DO CLIENTE LOGADO -->
        <div id="telaDashboard" class="dashboard-box" style="display: none;">
            <div class="welcome-msg" id="msgBoasVindas">Olá, Cliente!</div>
            <p style="font-size: 12px; text-align: center; color: var(--cor-cinza); margin-top: -6px;">Bem-vindo ao Micro Market</p>

            <div class="section-title">📍 Nossos Pontos de Mercadinhos</div>
            <div class="lojas-list">
                <div class="loja-item">
                    <strong>Carregando unidades...</strong><br>
                    <span>Aguarde...</span>
                </div>
            </div>

            <div class="section-title">📢 Espaço Publicitário</div>
            <div class="ads-space">
                Anuncie sua marca aqui!<br>Parceiros Micro Market
            </div>

            <button class="btn-vermelho" onclick="excluirProprioCadastro()" style="margin-top: 15px;">Excluir meu Cadastro</button>
            <button class="btn-cinza" onclick="location.reload()" style="margin-top: 6px;">Sair / Desconectar</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const mask = document.getElementById('mask');
        let fotoData = '';
        let cpfLogadoAtual = '';

        // Carregar unidades ao iniciar a página
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/unidades');
                const unidades = await res.json();
                
                const select = document.getElementById('unidade_id');
                const listaLojas = document.querySelector('.lojas-list');
                
                if (select && unidades.length > 0) {
                    select.innerHTML = '<option value="">Selecione a Unidade / Condomínio *</option>';
                    unidades.forEach(u => {
                        select.innerHTML += `<option value="${u.id}">${u.nome_condominio}</option>`;
                    });
                }

                if (listaLojas && unidades.length > 0) {
                    listaLojas.innerHTML = '';
                    unidades.forEach(u => {
                        listaLojas.innerHTML += `
                            <div class="loja-item">
                                <strong>${u.nome_condominio}</strong><br>
                                <span>Unidade ativa Micro Market</span>
                            </div>`;
                    });
                }
            } catch (err) {
                console.log("Erro ao carregar unidades:", err);
            }
        });

        // Ativar câmera se a pessoa for para o cadastro
        function iniciarCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => video.srcObject = stream)
                .catch(err => console.log("Câmera indisponível: " + err));
        }

        function mudarParaTela(telaId) {
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('telaCadastro').style.display = 'none';
            document.getElementById('telaDashboard').style.display = 'none';
            document.getElementById(telaId).style.display = 'block';

            if (telaId === 'telaCadastro') {
                iniciarCamera();
            }
        }

        function tirarFoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            fotoData = canvas.toDataURL('image/jpeg');
            video.style.display = 'none';
            mask.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('btnCapturar').innerText = 'Tirar Outra Foto';
            document.getElementById('btnCapturar').onclick = resetarFoto;
            document.getElementById('btnSalvar').style.display = 'block';
        }

        function resetarFoto() {
            video.style.display = 'block';
            mask.style.display = 'block';
            canvas.style.display = 'none';
            document.getElementById('btnCapturar').innerText = 'Capturar Foto';
            document.getElementById('btnCapturar').onclick = tirarFoto;
            document.getElementById('btnSalvar').style.display = 'none';
        }

        async function fazerLogin() {
            const cpf = document.getElementById('loginCpf').value;
            const senha = document.getElementById('loginSenha').value;
            const status = document.getElementById('statusLogin');

            if (!cpf || !senha) {
                status.innerText = "Preencha CPF e senha!";
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf, senha })
                });
                const dados = await res.json();
                if (dados.sucesso) {
                    cpfLogadoAtual = cpf;
                    document.getElementById('msgBoasVindas').innerText = `Olá, ${dados.nome}!`;
                    document.getElementById('telaLogin').style.display = 'none';
                    document.getElementById('telaDashboard').style.display = 'block';
                } else {
                    status.innerText = dados.erro;
                }
            } catch (err) {
                status.innerText = "Erro de conexão.";
            }
        }

        async function cadastrar() {
            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const senha = document.getElementById('senha').value;
            const telefone = document.getElementById('telefone').value;
            const email = document.getElementById('email').value;
            const rua = document.getElementById('rua').value;
            const bairro = document.getElementById('bairro').value;
            const cidade = document.getElementById('cidade').value;
            const estado = document.getElementById('estado').value;
            const pais = document.getElementById('pais').value;
            const unidade_id = document.getElementById('unidade_id').value;
            const status = document.getElementById('statusCadastro');

            if (!nome || !cpf || !senha || !fotoData || !unidade_id) {
                alert("Preencha Nome, CPF, Senha, escolha a Unidade e tire a foto!");
                return;
            }

            status.innerHTML = '<div class="spinner"></div> Cadastrando...';

            try {
                const res = await fetch('/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf, senha, telefone, email, rua, bairro, cidade, estado, pais, foto: fotoData, unidade_id })
                });
                const dados = await res.json();
                if (dados.sucesso) {
                    cpfLogadoAtual = cpf;
                    document.getElementById('msgBoasVindas').innerText = `Olá, ${nome}!`;
                    document.getElementById('telaCadastro').style.display = 'none';
                    document.getElementById('telaDashboard').style.display = 'block';
                } else {
                    status.innerText = "Erro: " + dados.erro;
                }
            } catch (err) {
                status.innerText = "Erro de conexão.";
            }
        }

        async function excluirProprioCadastro() {
            if (!confirm("Deseja realmente excluir seu cadastro?")) return;

            try {
                const res = await fetch('/deletar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf: cpfLogadoAtual })
                });
                const dados = await res.json();
                if (dados.sucesso) {
                    alert("Conta excluída com sucesso.");
                    location.reload();
                } else {
                    alert("Erro ao excluir.");
                }
            } catch (err) {
                alert("Erro de conexão.");
            }
        }
    </script>
</body>
</html>
