<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Mercadinho</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
        video, canvas { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; }
        button { width: 95%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastro de Cliente</h2>
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="text" id="cpf" placeholder="CPF" required>
        
        <div>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <button id="btnCapturar" onclick="tirarFoto()">Capturar Foto</button>
        <button id="btnSalvar" onclick="cadastrar()" style="display:none; background-color: #007bff;">Finalizar Cadastro</button>
        <p id="status"></p>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let fotoData = '';

        // Ativar a câmera do usuário
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => video.srcObject = stream)
            .catch(err => alert("Erro ao acessar a câmera: " + err));

        function tirarFoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            fotoData = canvas.toDataURL('image/jpeg');
            video.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('btnCapturar').innerText = 'Tirar Outra Foto';
            document.getElementById('btnCapturar').onclick = resetarFoto;
            document.getElementById('btnSalvar').style.display = 'block';
        }

        function resetarFoto() {
            video.style.display = 'block';
            canvas.style.display = 'none';
            document.getElementById('btnCapturar').innerText = 'Capturar Foto';
            document.getElementById('btnCapturar').onclick = tirarFoto;
            document.getElementById('btnSalvar').style.display = 'none';
        }

        async function cadastrar() {
            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const status = document.getElementById('status');

            if (!nome || !cpf || !fotoData) {
                alert("Preencha todos os campos e tire a foto!");
                return;
            }

            status.innerText = "Cadastrando...";

            const resposta = await fetch('/api/cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, cpf, foto: fotoData })
            });

            const dados = await resposta.json();
            if (dados.sucesso) {
                status.innerText = "Cadastro realizado com sucesso!";
                setTimeout(() => location.reload(), 2000);
            } else {
                status.innerText = "Erro: " + dados.erro;
            }
        }
    </script>
</body>
</html>
